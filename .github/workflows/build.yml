name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal app / ${{ matrix.arch }} flight checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          for script in scripts/*.sh 'Start Dogfight.command'; do
            zsh -n "$script"
          done
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build Apple Silicon and Intel
        run: ./scripts/build.sh --universal
      - name: Check pursuit and combat flight
        run: '"build/Asteroid Squadron.app/Contents/MacOS/AsteroidSquadron" --verify-pursuit'
      - name: Package development artifact
        if: matrix.arch == 'arm64'
        run: ditto -c -k --sequesterRsrc --keepParent 'build/Asteroid Squadron.app' build/Asteroid-Squadron-development-universal.zip
      - name: Upload development build (not notarized)
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Asteroid-Squadron-development-universal
          path: build/Asteroid-Squadron-development-universal.zip
          if-no-files-found: error
          retention-days: 7
